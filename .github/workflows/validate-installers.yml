name: Validate TeamTalk Linux Installer and Input Helper

on:
  push:
    branches: [ "main" ]
    paths:
      - "install.sh"
      - "install-gui.sh"
      - "uninstall.sh"
      - "diagnose-ctrl-ptt.sh"
      - "input-helper/**"
      - ".github/workflows/validate-installers.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: bash -n install.sh install-gui.sh uninstall.sh diagnose-ctrl-ptt.sh

      - name: Validate narrow KEY_LEFTCTRL helper
        run: |
          python3 -m py_compile input-helper/input-helper.py
          grep -q 'KEY_LEFTCTRL = 29' input-helper/input-helper.py
          grep -q 'event_type != EV_KEY or code != KEY_LEFTCTRL' input-helper/input-helper.py
          grep -q '/run/teamtalk-ctrl-ptt/input.sock' input-helper/input-helper.py
          grep -q 'User=root' input-helper/teamtalk-ctrl-ptt-input.service
          grep -q 'RuntimeDirectory=teamtalk-ctrl-ptt' input-helper/teamtalk-ctrl-ptt-input.service
          if grep -Eq 'print\(.*code|print\(.*event|logging\..*event' input-helper/input-helper.py; then
            echo 'Erro: o helper não deve registrar eventos/teclas.' >&2
            exit 1
          fi

      - name: Confirm Orca-friendly terminal installer
        run: |
          grep -q 'Instalador acessível' install-gui.sh
          grep -q 'Diagnosticar Ctrl PTT' install-gui.sh
          grep -q 'diagnose-ctrl-ptt.sh' install-gui.sh
          grep -q 'Feche-o completamente' install.sh
          if grep -Eq 'Gtk\.|get_accessible|zenity --|ProgressBar' install-gui.sh; then
            echo 'Erro: o lançador acessível não deve criar interface GTK/Zenity nem manipular foco customizado.' >&2
            exit 1
          fi
