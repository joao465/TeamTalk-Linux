name: Validate and Publish TeamTalk Linux Installers

on:
  push:
    branches: [ "main" ]
    paths:
      - "install.sh"
      - "install-gui.sh"
      - "uninstall.sh"
      - "gnome-extension/**"
      - ".github/workflows/validate-installers.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: bash -n install.sh install-gui.sh uninstall.sh

      - name: Validate embedded Python syntax
        run: |
          python3 - <<'PYVALIDATE'
          from pathlib import Path
          text = Path('install-gui.sh').read_text(encoding='utf-8')
          marker = 'python3 - "$@" <<\'PY\'\n'
          if marker not in text:
              raise SystemExit('Embedded GTK Python block not found')
          code = text.split(marker, 1)[1].rsplit('\nPY\n', 1)[0]
          compile(code, 'install-gui-embedded.py', 'exec')
          print('Embedded Python syntax OK')
          PYVALIDATE

      - name: Validate GNOME extension files
        run: |
          python3 -m json.tool gnome-extension/metadata.json >/dev/null
          node --check gnome-extension/extension.js
          grep -q 'teamtalk-ctrl-ptt-v2@joao465' gnome-extension/metadata.json
          grep -q 'Clutter.KEY_Control_L' gnome-extension/extension.js
          grep -q "captured-event" gnome-extension/extension.js
          grep -q "org.teamtalk.CtrlPTT" gnome-extension/extension.js
          grep -q "new GLib.Variant('(b)'" gnome-extension/extension.js
          grep -q 'return false' gnome-extension/extension.js

      - name: Confirm simplified GTK integration
        run: |
          grep -q 'Gtk.Button.new_with_label' install-gui.sh
          grep -q 'Gtk.Entry()' install-gui.sh
          grep -q 'set_editable(False)' install-gui.sh
          grep -q 'teamtalk-ctrl-ptt-v2@joao465' install-gui.sh
          grep -q 'teamtalk-ctrl-ptt@joao465' install-gui.sh
          grep -q 'Gio.Settings.new("org.gnome.shell")' install-gui.sh
          grep -q 'pkexec' install-gui.sh
          grep -q 'teamtalk5-linux.desktop' install-gui.sh
          if grep -q 'get_accessible()' install-gui.sh; then
            echo 'Erro: o instalador não deve manipular AT-SPI/Atk manualmente.' >&2
            exit 1
          fi
          if grep -q 'Gtk.ProgressBar' install-gui.sh; then
            echo 'Erro: a versão simplificada não deve usar barra de progresso dinâmica.' >&2
            exit 1
          fi
          if grep -qi 'zenity --' install-gui.sh; then
            echo 'Erro: o instalador gráfico não deve depender do Zenity.' >&2
            exit 1
          fi

      - name: Publish installers and GNOME extension to latest Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          echo "Updating installer/extension assets on release $TAG"
          gh release upload "$TAG" \
            install.sh install-gui.sh uninstall.sh \
            "gnome-extension/metadata.json#teamtalk-gnome-extension-metadata.json" \
            "gnome-extension/extension.js#teamtalk-gnome-extension.js" \
            --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --notes "Build Linux x86_64 baseado no TeamTalk5 oficial da BearWare. Inclui instalador GTK simplificado para evitar travamentos do Orca e extensão GNOME Shell com UUID novo para não reutilizar o módulo JavaScript em cache. A integração GNOME/Wayland captura Ctrl esquerdo pressionado/solto e chama o TeamTalk por D-Bus sem bloquear outras combinações com Ctrl. Em X11 o cliente continua usando XGrabKey."
