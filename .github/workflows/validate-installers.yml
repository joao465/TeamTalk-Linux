name: Validate and Publish TeamTalk Linux Installers

on:
  push:
    branches: [ "main" ]
    paths:
      - "install.sh"
      - "install-gui.sh"
      - "uninstall.sh"
      - "diagnose-ctrl-ptt.sh"
      - "gnome-extension/**"
      - ".github/workflows/validate-installers.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: bash -n install.sh install-gui.sh uninstall.sh diagnose-ctrl-ptt.sh

      - name: Validate GNOME extension files
        run: |
          python3 -m json.tool gnome-extension/metadata.json >/dev/null
          node --check gnome-extension/extension.js
          grep -q 'teamtalk-ctrl-ptt-v3@joao465' gnome-extension/metadata.json
          grep -q 'Clutter.KEY_Control_L' gnome-extension/extension.js
          grep -q 'Clutter.KeyController' gnome-extension/extension.js
          grep -q "captured-event" gnome-extension/extension.js
          grep -q 'org.teamtalk.CtrlPTT' gnome-extension/extension.js
          grep -q 'setGnomeCtrlPttPressed' gnome-extension/extension.js
          grep -q 'EVENT_PROPAGATE' gnome-extension/extension.js

      - name: Confirm Orca-friendly terminal installer
        run: |
          grep -q 'Instalador acessível' install-gui.sh
          grep -q 'Diagnosticar Ctrl PTT' install-gui.sh
          grep -q 'diagnose-ctrl-ptt.sh' install-gui.sh
          grep -q 'teamtalk-ctrl-ptt-v3@joao465' install.sh
          grep -q 'Feche-o completamente' install.sh
          grep -q 'getGnomeCtrlPttStatus' diagnose-ctrl-ptt.sh
          if grep -Eq 'Gtk\.|get_accessible|zenity --|ProgressBar' install-gui.sh; then
            echo 'Erro: o lançador acessível não deve criar interface GTK/Zenity nem manipular foco customizado.' >&2
            exit 1
          fi

      - name: Publish installers, diagnostics and GNOME extension to latest Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          echo "Updating installer/diagnostic assets on release $TAG"
          gh release upload "$TAG" \
            install.sh install-gui.sh uninstall.sh diagnose-ctrl-ptt.sh \
            "gnome-extension/metadata.json#teamtalk-gnome-extension-metadata.json" \
            "gnome-extension/extension.js#teamtalk-gnome-extension.js" \
            --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --notes "Build Linux x86_64 baseado no TeamTalk5 oficial da BearWare. O instalador acessível agora usa somente um terminal padrão, sem interface GTK/Zenity customizada. A extensão GNOME Shell v3 usa Clutter.KeyController com captured-event como fallback para Ctrl esquerdo e comunica com o TeamTalk por D-Bus. Inclui diagnose-ctrl-ptt.sh para identificar separadamente carregamento da extensão, captura do Ctrl, D-Bus e configuração do PTT."
