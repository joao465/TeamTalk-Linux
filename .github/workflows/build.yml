name: Build TeamTalk Linux Ctrl PTT

on:
  push:
    branches: [ "main" ]
    paths:
      - "patches/**"
      - "gnome-extension/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: teamtalk-linux-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/BearWare/TeamTalk5.git
  UPSTREAM_REF: 88e85978aa0592eef878bfa1e9d364cb132d6175
  ASSET_NAME: teamtalk-linux-ctrlptt-ubuntu26-x86_64.tgz

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Linux patch repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf cmake doxygen g++ git junit5 \
            libasound2-dev libglib2.0-dev libpcap-dev libpulse-dev \
            libspeechd-dev libssl-dev libtool libxss-dev make nasm \
            ninja-build openjdk-25-jdk 7zip pkg-config \
            python-is-python3 python3-pytest \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev \
            qt6-speech-dev qt6-tools-dev qt6-tools-dev-tools \
            wget xz-utils

      - name: Clone official BearWare TeamTalk5
        run: |
          git clone --recursive "$UPSTREAM_REPO" TeamTalk5
          git -C TeamTalk5 checkout "$UPSTREAM_REF"
          git -C TeamTalk5 submodule update --init --recursive
          echo "Official base: $(git -C TeamTalk5 rev-parse HEAD)"

      - name: Apply Linux Ctrl PTT patches
        run: |
          python3 patches/apply_linux_hotkeys.py TeamTalk5
          sed -i '/#include <QNativeInterface>/d' TeamTalk5/Client/qtTeamTalk/mainwindow.cpp
          python3 patches/apply_gnome_wayland_ptt.py TeamTalk5
          git -C TeamTalk5 diff -- \
            Client/qtTeamTalk/keycompdlg.cpp \
            Client/qtTeamTalk/mainwindow.h \
            Client/qtTeamTalk/mainwindow.cpp \
            Client/qtTeamTalk/utilhotkey.cpp

      - name: Build standard Linux client with complete log
        shell: bash
        run: |
          set -o pipefail

          LOG_DIR="$GITHUB_WORKSPACE/logs"
          LOG_FILE="$LOG_DIR/teamtalk-build.log"
          mkdir -p "$LOG_DIR" "$GITHUB_WORKSPACE/toolchain-install" "$GITHUB_WORKSPACE/install-stage"

          set +e
          (
            echo "===== TeamTalk Linux build diagnostics ====="
            echo "UTC start: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Runner: ${RUNNER_OS:-unknown} ${RUNNER_ARCH:-unknown}"
            echo "Workspace: $GITHUB_WORKSPACE"
            echo "Run ID: ${GITHUB_RUN_ID:-unknown}"
            echo "Run number: ${GITHUB_RUN_NUMBER:-unknown}"
            echo "Upstream: $UPSTREAM_REPO"
            echo "Upstream ref: $UPSTREAM_REF"
            echo
            uname -a || true
            lsb_release -a 2>/dev/null || cat /etc/os-release || true
            echo
            cmake --version || true
            ninja --version || true
            gcc --version || true
            g++ --version || true
            java -version || true
            echo

            cd "$GITHUB_WORKSPACE/TeamTalk5" || exit $?
            echo "Checked out TeamTalk commit: $(git rev-parse HEAD)"
            echo "===== Applied diff ====="
            git diff -- \
              Client/qtTeamTalk/keycompdlg.cpp \
              Client/qtTeamTalk/mainwindow.h \
              Client/qtTeamTalk/mainwindow.cpp \
              Client/qtTeamTalk/utilhotkey.cpp || true
            echo "===== End applied diff ====="
            echo

            source env.sh || exit $?

            echo "===== make -C Build ubuntu26 ====="
            make -C Build \
              CMAKE_BUILD_EXTRA="--parallel $(nproc)" \
              CMAKE_EXTRA="-G Ninja \
                -DFEATURE_WEBRTC=OFF \
                -DBUILD_TEAMTALK_SERVERS=OFF \
                -DBUILD_TEAMTALK_SERVER_SRVEXE=OFF \
                -DBUILD_TEAMTALK_SERVER_SRVEXEPRO=OFF \
                -DBUILD_TEAMTALK_LIBRARY_DLL=ON \
                -DBUILD_TEAMTALK_LIBRARY_DLLPRO=OFF \
                -DBUILD_TEAMTALK_LIBRARY_LIB=OFF \
                -DBUILD_TEAMTALK_LIBRARY_LIBPRO=OFF \
                -DBUILD_TEAMTALK_LIBRARY_JNI=OFF \
                -DBUILD_TEAMTALK_LIBRARY_JNIPRO=OFF \
                -DBUILD_TEAMTALK_LIBRARY_UNITTEST_CATCH2=OFF \
                -DBUILD_TEAMTALK_DOCUMENTATION=OFF \
                -DBUILD_TEAMTALK_CLIENT_PRISM=OFF \
                -DTOOLCHAIN_INSTALL_PREFIX=$GITHUB_WORKSPACE/toolchain-install \
                -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/install-stage" \
              ubuntu26
            MAKE_STATUS=$?
            echo "make exit code: $MAKE_STATUS"
            if [ "$MAKE_STATUS" -ne 0 ]; then
              exit "$MAKE_STATUS"
            fi

            echo
            echo "===== cmake install target ====="
            cmake --build Build/build-release-ubuntu26 \
              --target install --parallel "$(nproc)"
            INSTALL_STATUS=$?
            echo "cmake install exit code: $INSTALL_STATUS"
            exit "$INSTALL_STATUS"
          ) 2>&1 | tee "$LOG_FILE"

          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          echo "Complete build log: $LOG_FILE"
          echo "Final build exit code: $BUILD_STATUS"
          exit "$BUILD_STATUS"

      - name: Upload complete build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teamtalk-build-log-${{ github.run_number }}
          path: logs/teamtalk-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Package client
        shell: bash
        run: |
          set -e
          ROOT="$GITHUB_WORKSPACE/TeamTalk5"
          INSTALL="$GITHUB_WORKSPACE/install-stage"
          DIST="$GITHUB_WORKSPACE/dist"
          PKG="$DIST/teamtalk-linux-ctrlptt-ubuntu26-x86_64"

          rm -rf "$DIST"
          mkdir -p "$PKG/client" "$PKG/gnome-extension"

          cp -a "$INSTALL/Client/qtTeamTalk/." "$PKG/client/"
          cp "$INSTALL/Library/TeamTalk_DLL/libTeamTalk5.so" "$PKG/client/"
          cp "$ROOT/Setup/Client/Linux/TeamTalk5.ini" "$PKG/client/TeamTalk5.ini"
          cp "$ROOT/Setup/Client/Linux/TeamTalk5.ini" "$PKG/client/TeamTalk5.ini.default"
          cp -a "$ROOT/Setup/Client/Sounds" "$PKG/client/sounds"
          cp "$ROOT/Setup/Client/Linux/run.sh" "$PKG/client/run.sh"
          chmod +x "$PKG/client/teamtalk5" "$PKG/client/run.sh"

          cp gnome-extension/metadata.json "$PKG/gnome-extension/"
          cp gnome-extension/extension.js "$PKG/gnome-extension/"

          printf 'Base oficial: BearWare/TeamTalk5\nCommit: %s\nAlteração: Linux Qt6/X11 + GNOME Wayland Ctrl PTT v3 com diagnóstico D-Bus\nTeamTalk Pro: não incluído\n' \
            "$UPSTREAM_REF" > "$PKG/BUILD-INFO.txt"

          tar -czf "$DIST/$ASSET_NAME" -C "$DIST" "$(basename "$PKG")"
          sha256sum "$DIST/$ASSET_NAME" > "$DIST/$ASSET_NAME.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: teamtalk-linux-ctrlptt-ubuntu26
          path: |
            dist/${{ env.ASSET_NAME }}
            dist/${{ env.ASSET_NAME }}.sha256
            install.sh
            install-gui.sh
            uninstall.sh
            diagnose-ctrl-ptt.sh
            gnome-extension/metadata.json
            gnome-extension/extension.js

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="ubuntu26-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "dist/$ASSET_NAME" \
            "dist/$ASSET_NAME.sha256" \
            "install.sh" \
            "install-gui.sh" \
            "uninstall.sh" \
            "diagnose-ctrl-ptt.sh" \
            "gnome-extension/metadata.json#teamtalk-gnome-extension-metadata.json" \
            "gnome-extension/extension.js#teamtalk-gnome-extension.js" \
            --title "TeamTalk Linux Ctrl PTT - build ${GITHUB_RUN_NUMBER}" \
            --notes "Build Linux x86_64 baseado no TeamTalk5 oficial da BearWare. O instalador acessível usa um terminal padrão, sem GTK/Zenity customizado. A extensão GNOME Shell v3 usa Clutter.KeyController com captured-event como fallback e chama o TeamTalk por D-Bus. O cliente expõe diagnóstico D-Bus para separar falhas de extensão, captura, configuração e transmissão. Inclui diagnose-ctrl-ptt.sh."
